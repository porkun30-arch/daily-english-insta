name: sync
# 水 20:00 JST（リサーチャーの前）と 土 6:00 JST（生成の前）に、
# 反応データ・コメント・体験談 Issue をリポジトリに取り込む
on:
  schedule:
    - cron: "0 11 * * 3"   # 水 20:00 JST
    - cron: "0 21 * * 5"   # 土 06:00 JST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Labels
        run: |
          gh label create "体験談" --color FFD45C --description "つばさの体験談メモ" 2>/dev/null || true
          gh label create "ネタ候補" --color 1F3A5F --description "リサーチャーの週次ネタ候補" 2>/dev/null || true
      - run: python scripts/insights.py
        continue-on-error: true
      - run: python scripts/comments.py
        continue-on-error: true
      - run: python scripts/gh_tasks.py inbox
      - name: Commit
        run: |
          git config user.name "insta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A analytics research inbox
          git diff --cached --quiet && exit 0
          git commit -m "Sync insights/comments/inbox $(date +%F)"
          git pull --rebase && git push
