name: refresh-token
# 毎月 1日・15日：トークンの有効性チェック（IGAA トークンなら延長して Secret を上書き）
# 失敗したら GitHub からメール通知が届く → トークンを再発行する
on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/refresh_token.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Update secret
        if: hashFiles('token.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}  # Secrets の書き込み権限を持つ個人アクセストークン
        run: |
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < token.txt
          rm -f token.txt
