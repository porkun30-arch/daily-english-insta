name: refresh-token
# Instagram の長期トークン（60日）を毎月 1日・15日 に延長し、Secret を上書きする
on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/refresh_token.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Update secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}  # Secrets の書き込み権限を持つ個人アクセストークン
        run: |
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < token.txt
          rm -f token.txt
