name: setup-fonts
# 過去投稿の雰囲気に近い無料フォント（Google Fonts / OFL ライセンス）を取得して templates/fonts/ にコミットする
# 初回に1回だけ手動実行すればOK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download fonts
        run: |
          set -e
          mkdir -p templates/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          for f in mplusrounded1c/MPLUSRounded1c-Black.ttf \
                   mplusrounded1c/MPLUSRounded1c-ExtraBold.ttf \
                   mplusrounded1c/MPLUSRounded1c-Medium.ttf \
                   yuseimagic/YuseiMagic-Regular.ttf; do
            curl -fsSL "$base/$f" -o "templates/fonts/$(basename $f)"
            echo "downloaded $(basename $f)"
          done
          # ライセンス文（SIL Open Font License）。ファイル名はフォントごとに異なるので、あるものだけ取得
          for d in mplusrounded1c yuseimagic; do
            for lic in OFL.txt LICENSE.txt; do
              curl -fsSL "$base/$d/$lic" -o "templates/fonts/LICENSE-$d.txt" && break || true
            done
          done
          ls -la templates/fonts
      - name: Commit
        run: |
          git config user.name "insta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/fonts
          git diff --cached --quiet && exit 0
          git commit -m "Add fonts (M PLUS Rounded 1c, Yusei Magic)"
          git pull --rebase && git push
