name: build-week-pr
# week/** ブランチに push されたら：画像の再生成 → リール生成 → PR 作成/本文更新
# （PR 上で post.json を直すと、画像とリールも自動で作り直される）
on:
  push:
    branches: ["week/**"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          pip install -r requirements.txt

      - name: Changed dates
        id: d
        run: |
          DATES=$(git diff --name-only origin/main...HEAD -- queue | cut -d/ -f2 | sort -u | while read d; do [ -f "queue/$d/post.json" ] && echo $d; done | tr '\n' ' ')
          echo "dates=$DATES" >> $GITHUB_OUTPUT
          echo "対象: $DATES"

      - name: Render carousel
        if: steps.d.outputs.dates != ''
        run: |
          cd scripts && for d in ${{ steps.d.outputs.dates }}; do python render.py ../queue/$d || echo "::warning::$d の画像に警告あり"; done

      - name: Make reels
        if: steps.d.outputs.dates != ''
        run: |
          # GOOGLE_TTS_API_KEY が未登録なら音声なし（--silent）で作る
          SILENT=""
          if [ -z "$GOOGLE_TTS_API_KEY" ]; then SILENT="--silent"; echo "::warning::GOOGLE_TTS_API_KEY が未設定のため、リールは音声なしで作成します"; fi
          cd scripts && for d in ${{ steps.d.outputs.dates }}; do python make_reel.py $SILENT ../queue/$d; done

      - name: Commit generated files
        run: |
          git config user.name "insta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue
          git diff --cached --quiet || (git commit -m "Build images/reels" && git push)

      - name: Create or update PR
        if: steps.d.outputs.dates != ''
        run: |
          BR="${GITHUB_REF_NAME}"
          python scripts/gh_tasks.py pr-body "$BR" ${{ steps.d.outputs.dates }} > body.md
          if gh pr view "$BR" >/dev/null 2>&1; then
            gh pr edit "$BR" --body-file body.md
          else
            gh pr create --head "$BR" --base main --title "来週の投稿：${BR#week/} 〜" --body-file body.md
          fi
